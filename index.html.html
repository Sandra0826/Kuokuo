<html lang="zh-Hant">

<style>

header{background:#263238;color:white;padding:24px 6%}h1{margin:0 0 6px}main{max-width:1400px;margin:24px auto;padding:0 20px}
.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px #00000010}

.good{background:#2e7d32}.warn{background:#ef6c00}.gray{background:#607d8b}
input{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#eef2f5;padding:16px;border-radius:10px}.stat b{display:block;font-size:26px;margin-top:5px}
.wrap{overflow:auto;max-height:560px;border:1px solid #ddd;border-radius:8px}table{border-collapse:collapse;width:100%;font-size:13px}

.notice{background:#fff3e0;padding:12px;border-radius:9px;margin-top:10px}.tag{display:inline-block;background:#eceff1;border-radius:99px;padding:4px 8px;margin:3px;font-size:12px}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>

</div><p id="tags"></p></div>

<div class="card"><h2>資料預覽</h2><div id="table" class="wrap"></div></div>
</main>

function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){
 const d=cleaned||data;
 if(!d.length){document.getElementById('table').innerHTML='<p>目前沒有資料。</p>';return;}
 let s='<table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';
 d.slice(0,500).forEach(r=>s+='<tr>'+cols.map(c=>'<td>'+esc(r[c]??'')+'</td>').join('')+'</tr>');
 document.getElementById('table').innerHTML=s+'</tbody></table>';
 stats(d);
}
function stats(d){
 document.getElementById('rows').textContent=d.length;
 document.getElementById('cols').textContent=cols.length;
 const seen=new Set();let dup=0,empty=0;
 d.forEach(r=>{const k=JSON.stringify(cols.map(c=>r[c]??''));if(seen.has(k))dup++;else seen.add(k);cols.forEach(c=>{if(String(r[c]??'').trim()==='')empty++;});});
 document.getElementById('dups').textContent=dup;
 document.getElementById('empty').textContent=empty;
 document.getElementById('tags').innerHTML=cols.map(c=>'<span class="tag">'+esc(c)+'</span>').join('');
}
function clean(){
 const before=data.length, seen=new Set(), out=[];
 data.filter(r=>Object.values(r).some(v=>String(v).trim()!=='')).forEach(r=>{
   const n={};cols.forEach(c=>n[c]=String(r[c]??'').replace(/\s+/g,' ').trim());
   const key=JSON.stringify(cols.map(c=>n[c]));
   if(!seen.has(key)){seen.add(key);out.push(n);}
 });
 cleaned=out;render();
 document.getElementById('msg').textContent='清理完成：原始 '+before+' 筆 → 清理後 '+out.length+' 筆。';
}
function parseCSV(t){
 t=t.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',q=false;
 for(let i=0;i<t.length;i++){let ch=t[i],nx=t[i+1];
  if(ch=='"'){if(q&&nx=='"'){cell+='"';i++;}else q=!q;}
  else if(ch==','&&!q){row.push(cell);cell='';}
  else if((ch=='\n'||ch=='\r')&&!q){if(ch=='\r'&&nx=='\n')i++;row.push(cell);cell='';if(row.some(v=>v.trim()))rows.push(row);row=[];}
  else cell+=ch;
 }
 if(cell||row.length){row.push(cell);rows.push(row);}
 const h=rows.shift().map(x=>x.trim());
 return rows.map(a=>Object.fromEntries(h.map((x,i)=>[x,a[i]??''])));
}
document.getElementById('file').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{data=parseCSV(r.result);cols=data.length?Object.keys(data[0]):[];cleaned=null;render();document.getElementById('msg').textContent='已載入：'+f.name;};r.readAsText(f,'UTF-8');
};
function csvCell(v){v=String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function downloadCSV(){
 const d=cleaned||data;if(!d.length)return alert('沒有資料可下載。');
 const csv='\uFEFF'+[cols.map(csvCell).join(','),...d.map(r=>cols.map(c=>csvCell(r[c]??'')).join(','))].join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='食品廠生產日報_清理後.csv';a.click();
}
function reset(){data=[];cleaned=null;cols=[];render();document.getElementById('msg').textContent='請重新選擇 CSV。';}
